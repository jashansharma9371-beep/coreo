<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonBet 10 Games</title><style>body{background:#0f212e;color:#fff;font-family:Arial;margin:0;padding:10px}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;box-sizing:border-box}.card{background:#1a2c38;padding:15px;border-radius:12px;margin-top:10px;display:none}.card:first-of-type{display:block}button{cursor:pointer}</style></head><body>
<div id="a" style="max-width:360px;margin:50px auto;background:#132f44;padding:20px;border-radius:16px;text-align:center"><h2>MoonBet 10 GAMES</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="s()" style="width:100%;background:#00e701;padding:12px;font-weight:800;border:0;border-radius:8px;margin-top:10px">SIGNUP</button><button onclick="l()" style="width:100%;background:#fff;padding:12px;font-weight:800;border:0;border-radius:8px;margin-top:8px">LOGIN</button><div id="m" style="margin-top:10px"></div></div>
<div id="g" style="display:none;max-width:420px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center"><b id="un"></b><b>Bal: <span id="bal">1000</span> <button onclick="localStorage.clear();location.reload()" style="background:red;color:#fff;border:0;border-radius:5px;padding:5px 8px">Logout</button></b></div>
<div style="display:flex;gap:5px;margin:10px 0;overflow:auto;flex-wrap:wrap"><button onclick="sh('d1')">Dice</button><button onclick="sh('d2')">Mines</button><button onclick="sh('d3')">Aviator</button><button onclick="sh('d4')">TeenPatti</button><button onclick="sh('d5')">Cricket</button><button onclick="sh('d6')">Wheel</button><button onclick="sh('d7')">Coin</button><button onclick="sh('d8')">Plinko</button><button onclick="sh('d9')">Limbo</button><button onclick="sh('d10')">Color</button></div>

<div id="d1" class="card"><h3>1. Dice</h3><div id="dr" style="text-align:center;font-size:30px">?</div><button onclick="dice()" style="width:100%;background:#00e701;padding:14px;border:0;border-radius:8px;font-weight:800">ROLL (-10)</button></div>
<div id="d2" class="card"><h3>2. Mines</h3><div id="mg" style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px"></div><div id="mr" style="text-align:center;margin-top:8px"></div><button onclick="st()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:10px">NEW GAME (-10)</button></div>
<div id="d3" class="card"><h3>3. Aviator <span id="cm">1.00x</span></h3><div id="cm2" style="text-align:center;font-size:35px">✈️</div><button id="fb" onclick="fl()" style="width:100%;background:#00e701;padding:14px;border:0;border-radius:8px;font-weight:800">FLY (-10)</button></div>
<div id="d4" class="card"><h3>4. TeenPatti</h3><div id="tr" style="text-align:center;font-size:25px">?</div><div id="trMsg" style="text-align:center"></div><button onclick="teen()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:10px">DEAL (-20)</button></div>
<div id="d5" class="card"><h3>5. Cricket</h3><div id="cb" style="font-size:50px;text-align:center">🏏</div><div id="cr" style="text-align:center"></div><button onclick="crick()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:10px">HIT (-10)</button></div>
<div id="d6" class="card"><h3>6. Wheel Spin</h3><div id="wh" style="text-align:center;font-size:60px">🎡</div><div id="whR" style="text-align:center"></div><button onclick="wheel()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px">SPIN (-10)</button></div>
<div id="d7" class="card"><h3>7. Coin Flip</h3><div id="co" style="text-align:center;font-size:60px">🪙</div><div id="coR" style="text-align:center"></div><div style="display:flex;gap:5px"><button onclick="coin('H')" style="flex:1;background:orange;padding:12px;border:0;border-radius:8px">HEAD</button><button onclick="coin('T')" style="flex:1;background:cyan;padding:12px;border:0;border-radius:8px">TAIL</button></div></div>
<div id="d8" class="card"><h3>8. Plinko</h3><div id="pl" style="text-align:center;font-size:50px">🔴<br>⬇️</div><div id="plR" style="text-align:center"></div><button onclick="plinko()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px">DROP (-10)</button></div>
<div id="d9" class="card"><h3>9. Limbo 2x-100x</h3><div id="li" style="text-align:center;font-size:35px">1.00x</div><input id="lim" type="number" value="2" min="1.1" max="100" step="0.1" style="background:#0f212e;color:#fff"><button onclick="limbo()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:5px">BET (-10)</button><div id="liR" style="text-align:center"></div></div>
<div id="d10" class="card"><h3>10. Color Win</h3><div id="col" style="display:flex;gap:10px;justify-content:center;font-size:40px"><div>🔴</div><div>🟢</div><div>🔵</div></div><div id="colR" style="text-align:center;margin:8px"></div><div style="display:flex;gap:5px"><button onclick="color('R')" style="flex:1;background:red;padding:12px;border:0;border-radius:8px;color:#fff">RED 2x</button><button onclick="color('G')" style="flex:1;background:green;padding:12px;border:0;border-radius:8px;color:#fff">GREEN 2x</button><button onclick="color('B')" style="flex:1;background:blue;padding:12px;border:0;border-radius:8px;color:#fff">BLUE 5x</button></div></div>
</div>
<script>
let users=JSON.parse(localStorage.getItem('U')||'{}');let cur=localStorage.getItem('C');let bal=1000;if(cur&&users[cur]){bal=users[cur];go()}
function s(){let u=U();if(!u){m.innerText='Username dalo';return}users[u]=1000;localStorage.setItem('U',JSON.stringify(users));m.innerText='Done! Ab LOGIN dabao';m.style.color='#00e701'}
function l(){let u=U();if(!u){m.innerText='Username dalo';return}if(!users[u])users[u]=1000;cur=u;bal=users[cur];localStorage.setItem('C',cur);localStorage.setItem('U',JSON.stringify(users));go()}
function U(){return document.getElementById('u').value.trim()}function go(){a.style.display='none';g.style.display='block';un.innerText=cur;upd();st()}
function upd(){balEl.innerText=bal}const balEl=document.getElementById('bal');function sv(){users[cur]=bal;localStorage.setItem('U',JSON.stringify(users));upd()}
function sh(id){document.querySelectorAll('.card').forEach(c=>c.style.display='none');document.getElementById(id).style.display='block'}

function dice(){if(bal<10)return;let r=Math.random()*100;dr.innerText=r.toFixed(1);if(r>50){bal+=20;dr.innerText+=' WIN'}else{bal-=10;dr.innerText+=' LOSE'}sv()}
function st(){if(bal<10)return;bal-=10;sv();mg.innerHTML='';mr.innerText='Bomb se bacho';let bombs=new Set();while(bombs.size<6)bombs.add(Math.floor(Math.random()*25));for(let i=0;i<25;i++){let d=document.createElement('div');d.style.cssText='aspect-ratio:1;background:#0f212e;border:1px solid #234;border-radius:6px;display:flex;align-items:center;justify-content:center';d.innerText='?';d.onclick=function(){if(this.innerText!='?')return;if(bombs.has(i)){this.innerText='💣';this.style.background='#ff4444';mr.innerText='BOOM LOSE';mg.querySelectorAll('div').forEach(x=>x.onclick=null)}else{this.innerText='💎';this.style.background='#1a4a2e';bal+=5;sv();mr.innerText='WIN +5'}};mg.appendChild(d)}}
let af=false,am=1,t,crash=0;function fl(){let b=document.getElementById('fb');let c=document.getElementById('cm');if(!af){if(bal<10)return;af=true;am=1;bal-=10;sv();crash=1+Math.random()*6;b.innerText='CASHOUT';t=setInterval(()=>{am+=0.12;c.innerText=am.toFixed(2)+'x';if(am>=crash){clearInterval(t);af=false;b.innerText='FLY (-10)';c.innerText='CRASH @ '+crash.toFixed(2)+'x'}},150)}else{clearInterval(t);bal+=Math.floor(10*am);sv();af=false;b.innerText='FLY (-10)';c.innerText='WIN +'+Math.floor(10*am)}}
function teen(){if(bal<20)return;bal-=20;sv();if(Math.random()>0.5){bal+=45;tr.innerText='A K Q WIN +45'}else{tr.innerText='2 5 7 LOSE'}sv()}
function crick(){if(bal<10)return;bal-=10;sv();let a=['0','1','2','4','6','W'];let o=a[Math.floor(Math.random()*6)];cb.innerText=o;if(o=='6'){bal+=50;cr.innerText='SIX +50'}else if(o=='W'){cr.innerText='OUT'}else{bal+=parseInt(o)*4;cr.innerText=o+' Runs'}sv()}
function wheel(){if(bal<10)return;bal-=10;sv();let m=[0,2,5,10,0,20,0,3,50,0];let r=m[Math.floor(Math.random()*m.length)];wh.innerText='🎡 '+r+'x';if(r==0){whR.innerText='LOSE'}else{bal+=r*2;whR.innerText='WIN +'+(r*2)}sv()}
function coin(ch){if(bal<10)return;bal-=10;sv();let res=Math.random()>0.5?'H':'T';co.innerText=res=='H'?'🪙 HEAD':'🪙 TAIL';if(res==ch){bal+=20;coR.innerText='WIN +20'}else{coR.innerText='LOSE'}sv()}
function plinko(){if(bal<10)return;bal-=10;sv();let mult=[0,0.5,1,2,5,2,1,0.5,0];let r=mult[Math.floor(Math.random()*mult.length)];plR.innerText=r+'x';bal+=Math.floor(10*r);sv()}
function limbo(){if(bal<10)return;let target=parseFloat(document.getElementById('lim').value)||2;bal-=10;sv();let res=100/Math.random();if(res>100)res=100;li.innerText=res.toFixed(2)+'x';if(res>=target){let win=Math.floor(target*10);bal+=win;liR.innerText='WIN +'+win}else{liR.innerText='LOSE'}sv()}
function color(ch){if(bal<10)return;bal-=10;sv();let cols=['R','G','B'];let res=cols[Math.floor(Math.random()*3)];colR.innerText=res=='R'?'🔴 RED':res=='G'?'🟢 GREEN':'🔵 BLUE';if(res==ch){let win=ch=='B'?50:20;bal+=win;colR.innerText+=' WIN +'+win}else{colR.innerText+=' LOSE'}sv()}
</script></body></html>
