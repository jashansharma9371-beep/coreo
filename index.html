<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0f212e;color:#fff;font-family:Arial;margin:0;padding:10px}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;box-sizing:border-box}.card{background:#1a2c38;padding:15px;border-radius:12px;margin-top:10px}</style></head><body>
<div id="a" style="max-width:360px;margin:50px auto;background:#132f44;padding:20px;border-radius:16px;text-align:center"><h2>MoonBet - REAL</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="s()" style="width:100%;background:#00e701;padding:12px;font-weight:800;border:0;border-radius:8px;margin-top:10px">SIGNUP</button><button onclick="l()" style="width:100%;background:#fff;padding:12px;font-weight:800;border:0;border-radius:8px;margin-top:8px">LOGIN</button><div id="m" style="margin-top:10px"></div></div>
<div id="g" style="display:none;max-width:400px;margin:auto"><div style="display:flex;justify-content:space-between"><b id="un"></b><b>Bal: <span id="bal">1000</span> <button onclick="localStorage.clear();location.reload()" style="background:red;color:#fff;border:0;border-radius:5px;padding:5px">Logout</button></b></div>
<div style="display:flex;gap:5px;margin:10px 0;overflow:auto"><button onclick="sh('d1')">Dice</button><button onclick="sh('d2')">Mines</button><button onclick="sh('d3')">Aviator</button><button onclick="sh('d4')">TeenPatti</button><button onclick="sh('d5')">Cricket</button></div>
<div id="d1" class="card"><h3>Dice - 50/50</h3><div id="dr" style="text-align:center;font-size:30px;margin:10px">?</div><button onclick="dice()" style="width:100%;background:#00e701;padding:14px;border:0;border-radius:8px;font-weight:800">ROLL DICE</button></div>
<div id="d2" class="card" style="display:none"><h3>Mines - 4 Bomb</h3><div id="mg" style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px"></div><div id="mr" style="text-align:center;margin-top:8px"></div><button onclick="st()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:10px">NEW GAME ( -10 )</button></div>
<div id="d3" class="card" style="display:none"><h3>Aviator - Crash anytime</h3><div id="cm" style="text-align:center;font-size:35px">1.00x</div><button id="fb" onclick="fl()" style="width:100%;background:#00e701;padding:14px;border:0;border-radius:8px;font-weight:800">FLY (-10)</button></div>
<div id="d4" class="card" style="display:none"><h3>TeenPatti</h3><div id="tr" style="text-align:center;font-size:25px">?</div><div id="trMsg" style="text-align:center"></div><button onclick="teen()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:10px">DEAL (-20)</button></div>
<div id="d5" class="card" style="display:none"><h3>Cricket - 6=WIN, W=OUT</h3><div id="cb" style="font-size:50px;text-align:center">🏏</div><div id="cr" style="text-align:center"></div><button onclick="crick()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:10px">HIT (-10)</button></div></div>
<script>
let users=JSON.parse(localStorage.getItem('U')||'{}');let cur=localStorage.getItem('C');let bal=1000;if(cur&&users[cur]){bal=users[cur];go()}
function s(){let u=U();let p=P();if(!u||!p){m.innerText='Dono bharo';return}users[u]=1000;localStorage.setItem('U',JSON.stringify(users));m.innerText='Done! Ab LOGIN dabao';m.style.color='#00e701'}
function l(){let u=U();if(!u){m.innerText='Username dalo';return}if(!users[u]){users[u]=1000;localStorage.setItem('U',JSON.stringify(users))}cur=u;bal=users[cur];localStorage.setItem('C',cur);go()}
function U(){return document.getElementById('u').value.trim()}function P(){return document.getElementById('p').value.trim()}
function go(){a.style.display='none';g.style.display='block';un.innerText=cur;upd();st()}
function upd(){document.getElementById('bal').innerText=bal}function sv(){users[cur]=bal;localStorage.setItem('U',JSON.stringify(users));upd()}
function sh(id){document.querySelectorAll('.card').forEach(c=>c.style.display='none');document.getElementById(id).style.display='block'}
function dice(){if(bal<10){alert('Balance khatam');return}let r=Math.random()*100;dr.innerText=r.toFixed(1);if(r>50){bal+=20;dr.style.color='#00e701';dr.innerText+=' WIN +20'}else{bal-=10;dr.style.color='#ff4444';dr.innerText+=' LOSE -10'}sv()}
function st(){if(bal<10)return;bal-=10;sv();mg.innerHTML='';mr.innerText='Game Start! Bomb se bacho';let bombs=new Set();while(bombs.size<6){bombs.add(Math.floor(Math.random()*25))}for(let i=0;i<25;i++){let d=document.createElement('div');d.style.cssText='aspect-ratio:1;background:#0f212e;border:1px solid #234;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800';d.innerText='?';d.onclick=function(){if(this.innerText!='?')return;if(bombs.has(i)){this.innerText='💣';this.style.background='#ff4444';mr.innerText='BOOM! LOSE';mg.querySelectorAll('div').forEach(x=>x.onclick=null)}else{this.innerText='💎';this.style.background='#1a4a2e';bal+=5;sv();mr.innerText='WIN +5'}};mg.appendChild(d)}}
let af=false,am=1,t,crash=0;function fl(){let b=document.getElementById('fb');let c=document.getElementById('cm');if(!af){if(bal<10)return;af=true;am=1;bal-=10;sv();crash=1+Math.random()*6;b.innerText='CASHOUT';t=setInterval(()=>{am+=0.12;c.innerText=am.toFixed(2)+'x';if(am>=crash){clearInterval(t);af=false;b.innerText='FLY (-10)';c.innerText='CRASH @ '+crash.toFixed(2)+'x - LOSE'}},150)}else{clearInterval(t);let w=Math.floor(10*am);bal+=w;sv();af=false;b.innerText='FLY (-10)';c.innerText='WIN +'+w}}
function teen(){if(bal<20)return;bal-=20;sv();let v=Math.random();if(v>0.5){bal+=45;tr.innerText='A K Q';trMsg.innerText='YOU WIN +45';trMsg.style.color='#00e701'}else{tr.innerText='2 5 7';trMsg.innerText='YOU LOSE';trMsg.style.color='#ff4444'}sv()}
function crick(){if(bal<10)return;bal-=10;sv();let a=['0','1','2','4','6','W'];let o=a[Math.floor(Math.random()*6)];cb.innerText=o=='W'?'❌':o;if(o=='6'){bal+=50;cr.innerText='SIX! +50';cr.style.color='#00e701'}else if(o=='W'){cr.innerText='OUT! -10';cr.style.color='#ff4444'}else{let add=parseInt(o)*4;bal+=add;cr.innerText=o+' Runs +'+add;cr.style.color='#fff'}sv()}
</script></body></html>
