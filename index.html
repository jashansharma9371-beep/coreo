<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>MoonBet Stake</title><style>*{box-sizing:border-box}body{margin:0;background:#0e141b;color:#fff;font-family:Arial}.top{position:sticky;top:0;background:#151e27;padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #1f2e3d}.logo{font-weight:900;color:#00e701}.balBox{background:#1c2a38;padding:7px 12px;border-radius:20px;font-weight:800}.loginBox{max-width:360px;margin:80px auto;background:#151e27;padding:25px;border-radius:20px;text-align:center}.loginBox input{width:100%;padding:14px;background:#0e141b;border:1px solid #233445;border-radius:10px;color:#fff;margin:8px 0}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:900}.btnG{background:#00e701}.btnW{background:#fff;margin-top:8px}.nav{display:flex;gap:6px;overflow:auto;padding:10px}.nav button{background:#1a2b3a;color:#8ca3b8;border:1px solid #233445;padding:8px 12px;border-radius:20px;white-space:nowrap}.nav button.active{background:#00e701;color:#000}.card{background:#1a2b3a;border:1px solid #22344a;border-radius:16px;padding:16px;margin:10px;display:none}.card.show{display:block}.stat{font-size:38px;font-weight:900;text-align:center;margin:12px 0}.mines{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mine{aspect-ratio:1;background:#0e1a26;border:1px solid #233445;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}</style></head><body>
<div id=a class=loginBox><div style="font-size:28px;font-weight:900;color:#00e701">MOONBET</div><input id=u placeholder=Username><input id=p type=password placeholder=Password><button class="btn btnG" onclick=s()>SIGNUP</button><button class="btn btnW" onclick=l()>LOGIN</button><div id=m style="margin-top:10px"></div></div>
<div id=g style="display:none;max-width:480px;margin:auto"><div class=top><div class=logo>MOONBET -
<div id=d1 class="card show"><div id=dr class=stat>50.00</div><div id=drMsg style="text-align:center;margin-bottom:10px;color:#8ca3b8">Roll >50 to Win</div><button class="btn btnG" onclick=dice()>ROLL - ₹10</button></div>
<div id=d2 class=card><div id=mg class=mines></div><div id=mr style="text-align:center;margin:8px"></div><button class="btn btnG" onclick=st()>NEW GAME - ₹10</button></div>
<div id=d3 class=card><div id=cm class=stat>1.00x</div><button id=fb class="btn btnG" onclick=fl()>FLY - ₹10</button></div>
<div id=d4 class=card><div id=tr class=stat>?</div><button class="btn btnG" onclick=teen()>DEAL - ₹20</button><div id=trMsg style="text-align:center"></div></div>
<div id=d5 class=card><div id=cb class=stat>🏏</div><button class="btn btnG" onclick=crick()>HIT - ₹10</button><div id=cr style="text-align:center"></div></div>
<div id=d6 class=card><div id=wh class=stat>🎡</div><button class="btn btnG" onclick=wheel()>SPIN - ₹10</button><div id=whR style="text-align:center"></div></div>
<div id=d7 class=card><div id=co class=stat>🪙</div><div style="display:flex;gap:6px"><button style="flex:1;padding:12px;border-radius:10px;border:0;background:orange" onclick="coin('H')">HEAD</button><button style="flex:1;padding:12px;border-radius:10px;border:0;background:cyan" onclick="coin('T')">TAIL</button></div><div id=coR style="text-align:center"></div></div>
<div id=d8 class=card><div id=plR class=stat>0x</div><button class="btn btnG" onclick=plinko()>DROP - ₹10</button></div>
<div id=d9 class=card><div id=li class=stat>1.00x</div><input id=lim value=2 type=number style="width:100%;padding:10px;background:#0e141b;color:#fff;border-radius:8px;border:1px solid #233445"><button class="btn btnG" onclick=limbo() style="margin-top:6px">BET - ₹10

<div id=d10 class=card><div id=colR class=stat style="font-size:24px">Pick Color</div><div style="display:flex;gap:6px"><button style="flex:1;padding:12px;background:red;border:0;border-radius:8px;color:#fff" onclick="color('R')">RED</button><button style="flex:1;padding:12px;background:green;border:0;border-radius:8px;color:#fff" onclick="color('G')">GREEN</button><button style="flex:1;padding:12px;background:blue;border:0;border-radius:8px;color:#fff" onclick="color('B')">BLUE</button></div></div></div>
<script>let users=JSON.parse(localStorage.getItem('U')||'{}');let cur=localStorage.getItem('C');let bal=1000;if(cur&&users[cur]){bal=users[cur];go()}function s(){let u=document.getElementById('u').value.trim();if(!u)return;users[u]=1000;localStorage.setItem('U',JSON.stringify(users));m.innerText='Done! Login karo';m.style.color='#00e701'}function l(){let u=document.getElementById('u').value.trim();if(!u)return;if(!users[u])users[u]=1000;cur=u;bal=users[cur];localStorage.setItem('C',cur);localStorage.setItem('U',JSON.stringify(users));go()}function go(){a.style.display='none';g.style.display='block';upd();st()}function upd(){document.getElementById('bal').innerText=bal}function sv(){users[cur]=bal;localStorage.setItem('U',JSON.stringify(users));upd()}function sh(id,el){document.querySelectorAll('.card').forEach(c=>c.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
function dice(){if(bal<10)return;let r=Math.random()*100;dr.innerText=r.toFixed(2);if(r>50){bal+=20;drMsg.innerText='WIN +20'}else{bal-=10;drMsg.innerText='LOSE -10'}sv()}function st(){if(bal<10)return;bal-=10;sv();mg.innerHTML='';mr.innerText='Find 💎';let b=new Set();while(b.size<6)b.add(Math.floor(Math.random()*25));for(let i=0;i<25;i++){let d=document.createElement('div');d.className='mine';d.innerText='?';d.onclick=function(){if(this.innerText!='?')return;if(b.has(i)){this.innerText='💣';this.style.background='#ff4444';mr.innerText='BOOM LOSE';mg.querySelectorAll('.mine').forEach(x=>x.onclick=null)}else{this.innerText='💎';this.style.background='#1a4a2e';bal+=5;sv();mr.innerText='WIN +5'}};mg.appendChild(d)}}let af=false,am=1,t,crash=0;function fl(){let b=document.getElementById('fb');let c=document.getElementById('cm');if(!af){if(bal<10)return;af=true;am=1;bal-=10;sv();crash=1+Math.random()*6;b.innerText='CASHOUT';t=setInterval(()=>{am+=0.12;c.innerText=am.toFixed(2)+'x';if(am>=crash){clearInterval(t);af=false;b.innerText='FLY -10';c.innerText='CRASH @ '+crash.toFixed(2)+'x'}},150)}else{clearInterval(t);bal+=Math.floor(10*am);sv();af=false;b.innerText='FLY -10';c.innerText='WIN +'+Math.floor(10*am)}}function teen(){if(bal<20)return;bal-=20;sv();if(Math.random()>0.5){bal+=45;tr.innerText='A K Q WIN'}else{tr.innerText='2 5 7 LOSE'}sv()}function crick(){if(bal<10)return;bal-=10;sv();let a=['0','1','2','4','6','W'];let o=a[Math.floor(Math.random()*6)];cb.innerText=o;if(o=='6'){bal+=50;cr.innerText='SIX +50'}else if(o=='W'){cr.innerText='OUT'}else{bal+=parseInt(o)*4;cr.innerText=o+' Runs'}sv()}function wheel(){if(bal<10)return;bal-=10;sv();let m=[0,2,5,10,0,20,0,3,50,0];let r=m[Math.floor(Math.random()*m.length)];wh.innerText=r+'x';whR.innerText=r==0?'LOSE':'WIN +'+(r*2);if(r!=0)bal+=r*2;sv()}function coin(ch){if(bal<10)return;bal-=10;sv();let r=Math.random()>0.5?'H':'T';co.innerText=r;if(r==ch){bal+=20;coR.innerText='WIN +20'}else{coR.innerText='LOSE'}sv()}function plinko(){if(bal<10)return;bal-=10;sv();let m=[0,0.5,1,2,5,10,2,1,0.5,0];let r=m[Math.floor(Math.random()*m.length)];plR.innerText=r+'x';bal+=Math.floor(10*r);sv()}function limbo(){if(bal<10)return;let tgt=parseFloat(lim.value)||2;bal-=10;sv();let res=100/Math.random();li.innerText=res.toFixed(2)+'x';if(res>=tgt){let w=Math.floor(tgt*10);bal+=w;liR.innerText='WIN +'+w}else{liR.innerText='LOSE'}sv()}function color(ch){if(bal<10)return;bal-=10;sv();let c=['R','G','B'];let r=c[Math.floor(Math.random()*3)];colR.innerText=r;if(r==ch){let w=ch=='B'?50:20;bal+=w;colR.innerText+=' WIN +'+w}else{colR.innerText+=' LOSE'}sv()}</script></body></html>
