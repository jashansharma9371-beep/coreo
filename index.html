<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>MoonBet</title><style>*{box-sizing:border-box}body{margin:0;background:#0e141b;color:#fff;font-family:Arial}.top{position:sticky;top:0;background:#151e27;padding:12px;display:flex;justify-content:space-between}.logo{color:#00e701;font-weight:900}.balBox{background:#1c2a38;padding:6px 12px;border-radius:20px;font-weight:800}.box{max-width:360px;margin:70px auto;background:#151e27;padding:20px;border-radius:16px;text-align:center}.box input{width:100%;padding:12px;margin:6px 0;background:#0e141b;border:1px solid #233445;border-radius:8px;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:8px;font-weight:900}.btnG{background:#00e701}.btnW{background:#fff;margin-top:6px}.nav{display:flex;gap:6px;overflow:auto;padding:10px}.nav button{background:#1a2b3a;color:#8ca3b8;border:1px solid #233445;padding:7px 12px;border-radius:20px;white-space:nowrap}.nav button.active{background:#00e701;color:#000}.card{background:#1a2b3a;border:1px solid #22344a;border-radius:14px;padding:14px;margin:10px;display:none}.card.show{display:block}.stat{font-size:36px;font-weight:900;text-align:center;margin:10px 0}.mines{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mine{aspect-ratio:1;background:#0e1a26;border:1px solid #233445;border-radius:8px;display:flex;align-items:center;justify-content:center}</style></head><body>
<div id=a class=box><h2 style="color:#00e701;margin:0">MOONBET</h2><input id=u placeholder=Username><input id=p type=password placeholder=Password><button class="btn btnG" onclick=s()>SIGNUP</button><button class="btn btnW" onclick=l()>LOGIN</button><div id=m style="margin-top:8px"></div></div>
<div id=g style="display:none;max-width:480px;margin:auto"><div class=top><div class=logo>MOONBET</div><div class=balBox>₹<span id=bal>1000</span></div></div><div class=nav><button class=active onclick="sh('d1',this)">Dice</button><button onclick="sh('d2',this)">Mines</button><button onclick="sh('d3',this)">Aviator</button><button onclick="sh('d4',this)">TP</button><button onclick="sh('d5',this)">Cricket</button><button onclick="sh('d6',this)">Wheel</button><button onclick="sh('d7',this)">Coin</button><button onclick="sh('d8',this)">Plinko</button><button onclick="sh('d9',this)">Limbo</button><button onclick="sh('d10',this)">Color</button></div>
<div id=d1 class="card show"><div id=dr class=stat>50.00</div><button class="btn btnG" onclick=dice()>ROLL -10</button><div id=drMsg style="text-align:center"></div></div>
<div id=d2 class=card><div id=mg class=mines></div><div id=mr style="text-align:center"></div><button class="btn btnG" onclick=st()>NEW -10</button></div>
<div id=d3 class=card><div id=cm class=stat>1.00x</div><button id=fb class="btn btnG" onclick=fl()>FLY -10</button></div>
<div id=d4 class=card><div id=tr class=stat>?</div><button class="btn btnG" onclick=teen()>DEAL -20</button><div id=trMsg style="text-align:center"></div></div>
<div id=d5 class=card><div id=cb class=stat>🏏</div><button class="btn btnG" onclick=crick()>HIT -10</button><div id=cr style="text-align:center"></div></div>
<div id=d6 class=card><div id=wh class=stat>🎡</div><button class="btn btnG" onclick=wheel()>SPIN -10</button><div id=whR style="text-align:center"></div></div>
<div id=d7 class=card><div id=co class=stat>🪙</div><div style="display:flex;gap:6px"><button style="flex:1;padding:10px;border:0;border-radius:8px;background:orange" onclick="coin('H')">HEAD</button><button style="flex:1;padding:10px;border:0;border-radius:8px;background:cyan" onclick="coin('T')">TAIL</button></div><div id=coR style="text-align:center"></div></div>
<div id=d8 class=card><div id=plR class=stat>0x</div><button class="btn btnG" onclick=plinko()>DROP -10</button></div>
<div id=d9 class=card><div id=li class=stat>1.00x</div><input id=lim value=2 type=number style="width:100%;padding:8px;background:#0e141b;color:#fff;border:1px solid #233445;border-radius:6px"><button class="btn btnG" onclick=limbo() style="margin-top:6px">BET -10</button><div id=liR style="text-align:center"></div></div>
<div id=d10 class=card><div id=colR class=stat>Pick Color</div><div style="display:flex;gap:6px"><button style="flex:1;padding:10px;background:red;border:0;border-radius:6px;color:#fff" onclick="color('R')">RED</button><button style="flex:1;padding:10px;background:green;border:0;border-radius:6px;color:#fff" onclick="color('G')">GREEN</button><button style="flex:1;padding:10px;background:blue;border:0;border-radius:6px;color:#fff" onclick="color('B')">BLUE</button></div></div></div>
<script>let U=JSON.parse(localStorage.getItem('U')||'{}'),C=localStorage.getItem('C'),B=1000;if(C&&U[C]){B=U[C];go()}function s(){let u=document.getElementById('u').value.trim();if(!u)return;U[u]=1000;localStorage.setItem('U',JSON.stringify(U));m.innerText='Done! Login karo';m.style.color='#00e701'}function l(){let u=document.getElementById('u').value.trim();if(!u)return;if(!U[u])U[u]=1000;C=u;B=U[C];localStorage.setItem('C',C);localStorage.setItem('U',JSON.stringify(U));go()}function go(){a.style.display='none';g.style.display='block';up();st()}function up(){bal.innerText=B}function sv(){U[C]=B;localStorage.setItem('U',JSON.stringify(U));up()}function sh(id,el){document.querySelectorAll('.card').forEach(c=>c.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}function dice(){if(B<10)return;let r=Math.random()*100;dr.innerText=r.toFixed(2);B+=r>50?20:-10;drMsg.innerText=r>50?'WIN +20':'LOSE';sv()}function st(){mg.innerHTML='';mr.innerText='Find 💎';let b=new Set();while(b.size<6)b.add(Math.floor(Math.random()*25));for(let i=0;i<25;i++){let d=document.createElement('div');d.className='mine';d.innerText='?';d.onclick=function(){if(this.innerText!='?')return;if(b.has(i)){this.innerText='💣';this.style.background='#f44';mr.innerText='BOOM LOSE';mg.querySelectorAll('.mine').forEach(x=>x.onclick=null)}else{this.innerText='💎';this.style.background='#1a4a2e';B+=5;sv();mr.innerText='WIN +5'}};mg.appendChild(d)}}let af=false,am=1,t,cr=0;function fl(){let b=fb,c=cm;if(!af){if(B<10)return;af=true;am=1;B-=10;sv();cr=1+Math.random()*6;b.innerText='CASHOUT';t=setInterval(()=>{am+=0.12;c.innerText=am.toFixed(2)+'x';if(am>=cr){clearInterval(t);af=false;b.innerText='FLY -10';c.innerText='CRASH @'+cr.toFixed(2)+'x'}},120)}else{clearInterval(t);B+=Math.floor(10*am);sv();af=false;b.innerText='FLY -10';c.innerText='WIN +'+Math.floor(10*am)}}function teen(){if(B<20)return;B-=20;sv();if(Math.random()>0.5){B+=45;tr.innerText='A K Q WIN'}else{tr.innerText='2 5 7 LOSE'}sv()}function crick(){if(B<10)return;B-=10;sv();let a=['0','1','2','4','6','W'];let o=a[Math.floor(Math.random()*6)];cb.innerText=o;if(o=='6'){B+=50;cr.innerText='SIX +50'}else if(o=='W'){cr.innerText='OUT'}else{B+=parseInt(o)*4;cr.innerText=o+' Runs'}sv()}function wheel(){if(B<10)return;B-=10;sv();let m=[0,2,5,10,0,20,0,3,50,0];let r=m[Math.floor(Math.random()*m.length)];wh.innerText=r+'x';whR.innerText=r==0?'LOSE':'WIN +'+(r*2);if(r!=0)B+=r*2;sv()}function coin(ch){if(B<10)return;B-=10;sv();let r=Math.random()>0.5?'H':'T';co.innerText=r;coR.innerText=r==ch?'WIN +20':'LOSE';if(r==ch)B+=20;sv()}function plinko(){if(B<10)return;B-=10;sv();let m=[0,0.5,1,2,5,10,2,1,0.5,0];let r=m[Math.floor(Math.random()*m.length)];plR.innerText=r+'x';B+=Math.floor(10*r);sv()}function limbo(){if(B<10)return;let tgt=parseFloat(lim.value)||2;B-=10;sv();let res=100/Math.random();li.innerText=res.toFixed(2)+'x';if(res>=tgt){let w=Math.floor(tgt*10);B+=w;liR.innerText='WIN +'+w}else{liR.innerText='LOSE'}sv()}function color(ch){if(B<10)return;B-=10;sv();let c=['R','G','B'];let r=c[Math.floor(Math.random()*3)];colR.innerText=r;if(r==ch){let w=ch=='B'?50:20;B+=w;colR.innerText+=' WIN +'+w}else{colR.innerText+=' LOSE'}sv()}</script></body></html>
