<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>MoonBet</title><style>body{margin:0;background:#0f212e;color:#fff;font-family:Arial}.t{background:#1a2c38;padding:10px;display:flex;justify-content:space-between}.b{border:1px solid #555;padding:5px 12px;border-radius:6px}.n{display:flex;gap:5px;padding:10px;overflow:auto;background:#1a2c38}.n button{background:#213743;color:#fff;border:1px solid #333;padding:6px 12px;border-radius:15px}.n button.a{background:#fff;color:#000}.m{padding:15px}.c{background:#1a2c38;padding:20px;border-radius:10px;display:none;min-height:300px}.c.s{display:block}.s2{font-size:40px;text-align:center;margin:20px 0}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:300px;margin:auto}.g div{background:#2a3c4a;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px}button.bet{background:#00e701;border:0;padding:12px;width:100%;border-radius:6px;font-weight:900;margin-top:10px}</style></head><body><div class=t><b><span style="color:#00e701">MOON</span>BET</b><div class=b>₹<span id=bal>1000</span></div></div><div class=n><button class=a onclick="sw('c1',this)">Dice</button><button onclick="sw('c2',this)">Mines</button><button onclick="sw('c3',this)">Crash</button><button onclick="sw('c4',this)">TP</button><button onclick="sw('c5',this)">Cricket</button><button onclick="sw('c6',this)">Wheel</button><button onclick="sw('c7',this)">Coin</button><button onclick="sw('c8',this)">Plinko</button><button onclick="sw('c9',this)">Limbo</button><button onclick="sw('c10',this)">Color</button></div><div class=m>
<div id=c1 class="c s"><div id=d1 class=s2>50</div><input id=sl type=range min=10 max=90 value=50 style="width:100%"><button class=bet onclick="dice()">ROLL Bet 10</button><div id=r1 style="text-align:center"></div></div>
<div id=c2 class=c><div id=mg class=g></div><button class=bet onclick="mines()">NEW GAME Bet 10</button><div id=r2 style="text-align:center"></div></div>
<div id=c3 class=c><div id=cr class=s2>1.00x</div><button class=bet id=cb onclick="crash()">FLY Bet 10</button></div>
<div id=c4 class=c><div id=t1 class=s2>♠️ ♥️</div><button class=bet onclick="tp()">DEAL Bet 10</button></div>
<div id=c5 class=c><div id=ck class=s2>🏏</div><button class=bet onclick="ckf()">HIT Bet 10</button></div>
<div id=c6 class=c><div id=wh class=s2>🎡</div><button class=bet onclick="whf()">SPIN Bet 10</button></div>
<div id=c7 class=c><div id=co class=s2>🪙</div><div style="display:flex;gap:6px"><button class=bet style="background:#ff9f43" onclick="cof('H')">HEAD</button><button class=bet style="background:#0abde3" onclick="cof('T')">TAIL</button></div><div id=r7 style="text-align:center"></div></div>
<div id=c8 class=c><div id=pl class=s2>0x</div><button class=bet onclick="plf()">DROP Bet 10</button></div>
<div id=c9 class=c><div id=li class=s2>1.00x</div><button class=bet onclick="lif()">BET 2x Bet 10</button></div>
<div id=c10 class=c><div id=cl class=s2>PICK</div><div style="display:flex;gap:6px"><button class=bet style="background:#e74c3c" onclick="clf('R')">RED</button><button class=bet style="background:#2ecc71" onclick="clf('G')">GREEN</button><button class=bet style="background:#3498db" onclick="clf('B')">BLUE</button></div></div>
</div><script>
let B=1000,bet=10,ms=new Set(),cOn=false,cr=0,am=1,t,crEl=document.getElementById('cr');
function up(){bal.innerText=B.toFixed(0)}
function sw(id,el){document.querySelectorAll('.c').forEach(x=>x.classList.remove('s'));document.getElementById(id).classList.add('s');document.querySelectorAll('.n button').forEach(x=>x.classList.remove('a'));el.classList.add('a')}
function dice(){if(B<bet)return;let r=Math.random()*100;d1.innerText=r.toFixed(1);if(r>50){B+=bet;r1.innerText='WIN +'+bet}else{B-=bet;r1.innerText='LOSE -'+bet}up()}
function mines(){if(B<bet)return;B-=bet;up();mg.innerHTML='';ms=new Set();while(ms.size<5)ms.add(Math.floor(Math.random()*25));for(let i=0;i<25;i++){let d=document.createElement('div');d.innerText='?';d.onclick=function(){if(d.innerText!='?')return;if(ms.has(i)){d.innerText='💣';d.style.background='red';r2.innerText='LOSE'}else{d.innerText='💎';d.style.background='#00e701';B+=3;r2.innerText='WIN +3';up()}};mg.appendChild(d)}}
function crash(){if(!cOn){if(B<bet)return;B-=bet;up();cOn=true;am=1;cr=1+Math.random()*6;cb.innerText='CASHOUT';t=setInterval(()=>{am+=0.07;crEl.innerText=am.toFixed(2)+'x';cb.innerText='CASHOUT '+(bet*am).toFixed(0);if(am>=cr){clearInterval(t);cOn=false;crEl.innerText='CRASH @'+cr.toFixed(2);cb.innerText='FLY'}},100)}else{clearInterval(t);cOn=false;B+=bet*am;up();crEl.innerText='WIN '+(bet*am).toFixed(0);cb.innerText='FLY'}}
function tp(){if(B<bet)return;B-=bet;up();if(Math.random()>0.5){B+=bet*2;t1.innerText='A K Q WIN'}else{t1.innerText='2 5 7 LOSE'}up()}
function ckf(){if(B<bet)return;B-=bet;up();let a=['0','1','4','6','W'];let o=a[Math.floor(Math.random()*5)];ck.innerText=o;if(o=='6')B+=bet*5;else if(o!='W'&&o!='0')B+=bet*Number(o);up()}
function whf(){if(B<bet)return;B-=bet;up();let m=[0,2,5,10,0];let r=m[Math.floor(Math.random()*5)];wh.innerText=r==0?'💥':r+'x';if(r>0)B+=bet*r;up()}
function cof(c){if(B<bet)return;B-=bet;up();let r=Math.random()>0.5?'H':'T';co.innerText=r;if(r==c){B+=bet*2;r7.innerText='WIN'}else{r7.innerText='LOSE'}up()}
function plf(){if(B<bet)return;B-=bet;up();let m=[0,0.5,1,2,5,10];let r=m[Math.floor(Math.random()*6)];pl.innerText=r+'x';B+=bet*r;up()}
function lif(){if(B<bet)return;B-=bet;up();let r=99/Math.random();li.innerText=r.toFixed(2)+'x';if(r>2)B+=bet*2;up()}
function clf(c){if(B<bet)return;B-=bet;up();let a=['R','G','B'];let r=a[Math.floor(Math.random()*3)];cl.innerText=r;if(r==c)B+=bet*(c=='B'?14:2);up()}
mines();up();
</script></body></html>
