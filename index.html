<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0f212e;color:#fff;font-family:Arial;margin:0;padding:10px}input{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:8px;border:0}.card{background:#1a2c38;padding:15px;border-radius:12px;margin-top:10px}</style></head><body>
<div id="a" style="max-width:360px;margin:50px auto;background:#132f44;padding:20px;border-radius:16px;text-align:center"><h2>MoonBet</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="s()" style="width:100%;background:#00e701;padding:12px;font-weight:800;border:0;border-radius:8px;margin-top:10px">SIGNUP</button><button onclick="l()" style="width:100%;background:#fff;padding:12px;font-weight:800;border:0;border-radius:8px;margin-top:8px">LOGIN</button><div id="m" style="margin-top:10px"></div></div>
<div id="g" style="display:none;max-width:400px;margin:auto"><div style="display:flex;justify-content:space-between"><b id="un"></b><b>Bal: <span id="bal">1000</span> <button onclick="localStorage.clear();location.reload()" style="background:red;color:#fff;border:0;border-radius:5px">Logout</button></b></div>
<div style="display:flex;gap:5px;margin:10px 0;overflow:auto"><button onclick="sh('d1')">Dice</button><button onclick="sh('d2')">Mines</button><button onclick="sh('d3')">Aviator</button><button onclick="sh('d4')">TeenPatti</button><button onclick="sh('d5')">Cricket</button></div>
<div id="d1" class="card"><h3>Dice</h3><button onclick="bal+=10;sv();dr.innerText='WIN'" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;font-weight:800">WIN</button><button onclick="bal-=10;sv();dr.innerText='LOSE'" style="width:100%;background:#ff4444;padding:12px;border:0;border-radius:8px;margin-top:5px">LOSE</button><div id="dr" style="text-align:center;margin-top:8px"></div></div>
<div id="d2" class="card" style="display:none"><h3>Mines</h3><div id="mg" style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px"></div><button onclick="st()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px;margin-top:10px">START</button></div>
<div id="d3" class="card" style="display:none"><h3>Aviator <span id="cm">1.00x</span></h3><button id="fb" onclick="fl()" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px">FLY</button></div>
<div id="d4" class="card" style="display:none"><h3>TeenPatti</h3><button onclick="bal+=20;sv();tr.innerText='WIN'" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px">DEAL - WIN</button><div id="tr"></div></div>
<div id="d5" class="card" style="display:none"><h3>Cricket</h3><div id="cb" style="font-size:40px;text-align:center">🏏</div><button onclick="bal+=40;sv();cr.innerText='SIX!'" style="width:100%;background:#00e701;padding:12px;border:0;border-radius:8px">HIT SIX</button><div id="cr"></div></div></div>
<script>
let users=JSON.parse(localStorage.getItem('U')||'{}');let cur=localStorage.getItem('C');let bal=1000;if(cur&&users[cur]){bal=users[cur];go()}
function s(){let u=document.getElementById('u').value.trim();let p=document.getElementById('p').value.trim();if(!u||!p){m.innerText='Dono bharo';return}users[u]=1000;localStorage.setItem('U',JSON.stringify(users));m.innerText='Done! Ab LOGIN dabao';m.style.color='#00e701'}
function l(){let u=document.getElementById('u').value.trim();if(!users[u]&&u){users[u]=1000;localStorage.setItem('U',JSON.stringify(users))}if(!u){m.innerText='Username dalo';return}cur=u;bal=users[cur];localStorage.setItem('C',cur);go()}
function go(){a.style.display='none';g.style.display='block';un.innerText=cur;balEl();st()}
function balEl(){document.getElementById('bal').innerText=bal}function sv(){users[cur]=bal;localStorage.setItem('U',JSON.stringify(users));balEl()}
function sh(id){document.querySelectorAll('.card').forEach(c=>c.style.display='none');document.getElementById(id).style.display='block'}
function st(){mg.innerHTML='';for(let i=0;i<25;i++){let d=document.createElement('div');d.style.cssText='aspect-ratio:1;background:#0f212e;border:1px solid #234;border-radius:6px;display:flex;align-items:center;justify-content:center';d.innerText='?';d.onclick=function(){this.innerText='O';this.style.background='green';bal+=10;sv()};mg.appendChild(d)}}
let af=false,am=1,t;function fl(){let b=document.getElementById('fb');let c=document.getElementById('cm');if(!af){af=true;am=1;bal-=10;sv();b.innerText='CASHOUT';t=setInterval(()=>{am+=0.1;c.innerText=am.toFixed(2)+'x';if(am>5){clearInterval(t);af=false;b.innerText='FLY';c.innerText='CRASH'}},150)}else{clearInterval(t);bal+=Math.floor(am*10);sv();af=false;b.innerText='FLY';c.innerText='WIN'}}
</script></body></html>
