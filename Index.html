<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonBet v3</title><style>body{background:#0f212e;color:#fff;font-family:Arial;display:flex;height:100vh;margin:0}.sidebar{width:200px;background:#1a2c38;padding:16px}.sidebar a{display:block;padding:10px;color:#b1bad3;cursor:pointer}.sidebar a.active{color:#fff;background:#213743;border-left:3px solid #00e701}.main{flex:1;overflow:auto;padding:20px}.game-card{background:#1a2c38;padding:20px;border-radius:12px;width:450px;margin-bottom:20px}.btn{background:#00e701;color:#052e16;border:none;padding:12px 20px;border-radius:6px;font-weight:800;cursor:pointer;width:100%}.btn.ghost{background:#2f4553;color:#fff;margin-top:10px}.hidden{display:none}input,select{width:100%;padding:10px;background:#213743;border:1px solid #2f4553;color:#fff;border-radius:6px;margin:6px 0}.ball{display:inline-flex;width:32px;height:32px;border-radius:50%;background:#213743;align-items:center;justify-content:center;margin:4px;font-weight:700}.ball.four{background:#1a6b1f}.ball.six{background:#ffb800;color:#000}.ball.w{background:#ff2e2e}.card{width:80px;height:120px;background:#fff;color:#111;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin:6px}</style></head><body><div class="sidebar"><h2>Moon<span style="color:#00e701">Bet</span> v3</h2><a class="active" onclick="show('dice',this)">🎲 Dice</a><a onclick="show('mines',this)">💣 Mines</a><a onclick="show('limbo',this)">🎯 Limbo</a><a onclick="show('roulette',this)">🎡 Roulette</a><a onclick="show('cricket',this)">🏏 Cricket NEW</a><a onclick="show('cards',this)">🃏 Cards NEW</a><div style="margin-top:20px">Bal: <b id="bal">1000.00</b></div><button style="background:#2f4553;color:#fff;border:none;padding:8px;border-radius:6px;width:100%;margin-top:10px" onclick="bal=1000;render()">Top Up</button></div><div class="main"><div class="game-card" id="c-dice"><h3>Dice</h3><input id="bet" value="10" type="number"><input id="target" type="range" min="2" max="98" value="50"><div id="diceOut">—</div><button class="btn" onclick="rollDice()">ROLL</button></div><div class="game-card hidden" id="c-mines"><h3>Mines</h3><select id="mineCount"><option>3</option><option>5</option><option>10</option></select><input id="mineBet" value="10" type="number"><div id="mineGrid"></div><button class="btn" onclick="startMines()">BET / CASHOUT</button><div id="mineInfo"></div></div><div class="game-card hidden" id="c-limbo"><h3>Limbo</h3><input id="limboTarget" value="2" type="number"><input id="limboBet" value="10" type="number"><div id="limboOut" style="font-size:32px;text-align:center;margin:12px">—</div><button class="btn" onclick="rollLimbo()">BET</button></div><div class="game-card hidden" id="c-roulette"><h3>Roulette</h3><select id="rouPick"><option value="red">Red 2x</option><option value="black">Black 2x</option><option value="even">Even 2x</option><option value="odd">Odd 2x</option><option value="zero">Zero 36x</option></select><input id="rouBet" value="10" type="number"><div id="rouOut" style="text-align:center;font-size:28px;margin:12px">—</div><button class="btn" onclick="spinRou()">SPIN</button></div><div class="game-card hidden" id="c-cricket"><h3>iCricket Chase NEW</h3><select id="crickTarget"><option value="10">10 runs - 1.8x</option><option value="18" selected>18 runs - 2.5x</option><option value="30">30 runs - 4.2x</option><option value="45">45 runs - 7.5x</option></select><input id="crickBet" value="10" type="number"><div style="background:#1e4020;padding:12px;border-radius:8px;margin:10px 0"><div><span id="crickScore">0/0</span> - <span id="crickNeed">Need 18</span></div><div id="crickBalls"></div><div id="crickMsg" style="text-align:center;font-weight:800;margin-top:8px">Press HIT to start!</div></div><button class="btn" id="crickBtn" onclick="playCricket()">START CHASE</button></div><div class="game-card hidden" id="c-cards"><h3>Hi-Lo Cards + Andar Bahar NEW</h3><select id="cardMode"><option value="hi">Higher</option><option value="lo">Lower</option></select><input id="cardBet" value="10" type="number"><div style="text-align:center;margin:12px"><span class="card" id="cardBase">?</span><span class="card" id="cardNext" style="display:none">?</span></div><div id="cardInfo" style="text-align:center;color:#b1bad3">Draw base card first</div><button class="btn" onclick="playCards()" id="cardBtn">DRAW BASE</button><button class="btn ghost" onclick="playAB()">Andar Bahar 1.95x Side Bet</button><div>Streak: <span id="streak">0</span></div></div><div class="game-card"><h3>History</h3><div id="hist" style="font-size:13px;color:#b1bad3">No bets</div></div></div><script>let bal=1000,nonce=0,serverSeed=[...crypto.getRandomValues(new Uint8Array(32))].map(b=>b.toString(16).padStart(2,'0')).join('');function render(){document.getElementById('bal').textContent=bal.toFixed(2);}function show(id,el){document.querySelectorAll('.game-card').forEach(c=>{if(c.id.startsWith('c-'))c.classList.add('hidden')});document.getElementById('c-'+id).classList.remove('hidden');document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));el.classList.add('active');}function get(id){return parseFloat(document.getElementById(id).value)||0}function check(v){if(v<=0||v>bal){alert('Invalid bet');return false}return true}function addHist(t){const h=document.getElementById('hist');h.innerHTML=t+'<br>'+h.innerHTML}async function fair(){nonce++;const msg='seed:'+nonce;const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(serverSeed),{name:'HMAC',hash:'SHA-256'},false,['sign']);const sig=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(msg));const b=new Uint8Array(sig);let h=0;for(let i=0;i<4;i++){h=h*256+b[i]}return (h%1000000)/1000000}async function rollDice(){let bet=get('bet');if(!check(bet))return;let f=await fair();let roll=f*100;let t=parseFloat(document.getElementById('target').value);let won=roll>t;let mult=99/(99-t);let profit=won?bet*mult*0.99-bet:-bet;bal+=profit;document.getElementById('diceOut').textContent=roll.toFixed(2)+(won?' WIN +'+profit.toFixed(2):' LOSE');render();addHist('Dice '+roll.toFixed(2)+' '+(won?'WIN':'LOSE'))}let minePos=[],mineRev=0,mineActive=false,mineBet=0;function build(){let g=document.getElementById('mineGrid');g.innerHTML='';for(let i=0;i<25;i++){let b=document.createElement('button');b.textContent='?';b.style.width='18%';b.style.aspectRatio='1';b.style.margin='2px';b.onclick=()=>clickMine(i);b.id='m'+i;g.appendChild(b);}}build();async function startMines(){if(mineActive){let m=1;let cnt=parseInt(document.getElementById('mineCount').value);for(let i=0;i<mineRev;i++){m*=(25-i)/(25-cnt-i)}m*=0.99;let profit=mineBet*(m-1);bal+=profit;addHist('Mines cashout '+profit.toFixed(2));render();mineActive=false;return}let bet=get('mineBet');if(!check(bet))return;mineBet=bet;mineRev=0;mineActive=true;let cnt=parseInt(document.getElementById('mineCount').value);minePos=[];while(minePos.length<cnt){let f=await fair();let p=Math.floor(f*25);if(!minePos.includes(p))minePos.push(p)}build();}function clickMine(i){if(!mineActive)return;if(minePos.includes(i)){bal-=mineBet;addHist('Mines BOOM -'+mineBet);render();mineActive=false;return;}document.getElementById('m'+i).textContent='💎';mineRev++;}async function rollLimbo(){let bet=get('limboBet');if(!check(bet))return;let f=await fair();let res=0.99/(1-f);let target=get('limboTarget');let won=res>=target;let profit=won?bet*target*0.99-bet:-bet;bal+=profit;document.getElementById('limboOut').textContent=res.toFixed(2)+'x '+(won?'WIN':'LOSE');render();addHist('Limbo '+res.toFixed(2)+'x')}async function spinRou(){let bet=get('rouBet');if(!check(bet))return;let f=await fair();let n=Math.floor(f*37);let pick=document.getElementById('rouPick').value;let red=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];let won=false,mult=0;if(pick=='red'&&red.includes(n)){won=true;mult=2}if(pick=='black'&&n!=0&&!red.includes(n)){won=true;mult=2}if(pick=='even'&&n!=0&&n%2==0){won=true;mult=2}if(pick=='odd'&&n%2==1){won=true;mult=2}if(pick=='zero'&&n==0){won=true;mult=36}let profit=won?bet*(mult-1):-bet;bal+=profit;document.getElementById('rouOut').textContent=n+' '+(won?'WIN':'LOSE');render();addHist('Roulette '+n)}let crick=null;function cMult(t){return {10:1.8,18:2.5,30:4.2,45:7.5}[t]||2.5}async function playCricket(){if(crick&&crick.playing){let f=await fair();let run=0,isW=false;if(f<0.05)isW=true;else if(f<0.1)run=3;else if(f<0.25)run=2;else if(f<0.43)run=0;else if(f<0.71)run=1;else if(f<0.89)run=4;else run=6;let d=document.createElement('span');d.className='ball '+(isW?'w':run==4?'four':run==6?'six':'');d.textContent=isW?'W':run;document.getElementById('crickBalls').appendChild(d);if(isW)crick.w++;else crick.s+=run;crick.b++;document.getElementById('crickScore').textContent=crick.s+'/'+crick.w;let need=crick.t-crick.s;document.getElementById('crickNeed').textContent=need>0?'Need '+need:'Won!';if(need<=0){let prof=crick.bet*(crick.mult-1);bal+=prof;document.getElementById('crickMsg').textContent='WON +'+prof.toFixed(2);addHist('Cricket WIN +'+prof.toFixed(2));render();crick.playing=false;}else if(crick.w>=2||crick.b>=12){bal-=crick.bet;document.getElementById('crickMsg').textContent='LOST';addHist('Cricket LOSE');render();crick.playing=false;}return}let bet=get('crickBet');if(!check(bet))return;let t=parseInt(document.getElementById('crickTarget').value);crick={t,s:0,w:0,b:0,bet,mult:cMult(t),playing:true};document.getElementById('crickBalls').innerHTML='';document.getElementById('crickScore').textContent='0/0';document.getElementById('crickNeed').textContent='Need '+t;document.getElementById('crickMsg').textContent='Chasing '+t;}let base=null,baseDrawn=false,streak=0;function toStr(v){return {1:'A',11:'J',12:'Q',13:'K'}[v]||v}async function playCards(){let bet=get('cardBet');if(!baseDrawn){if(!check(bet))return;let f=await fair();base=Math.floor(f*13)+1;document.getElementById('cardBase').textContent=toStr(base);document.getElementById('cardNext').style.display='none';document.getElementById('cardInfo').textContent='Base '+toStr(base);document.getElementById('cardBtn').textContent='BET '+document.getElementById('cardMode').value.toUpperCase();baseDrawn=true;return}let f=await fair();let nxt=Math.floor(f*13)+1;document.getElementById('cardNext').textContent=toStr(nxt);document.getElementById('cardNext').style.display='inline-flex';let mode=document.getElementById('cardMode').value;let won=false;if(nxt!=base){won=mode=='hi'?nxt>base:nxt<base}let prob=mode=='hi'?(13-base)/12:(base-1)/12;let mult=prob>0?0.98/prob:0;let profit=won?bet*(mult-1):-bet;if(won){streak++;document.getElementById('cardInfo').textContent='WIN '+toStr(base)+'->'+toStr(nxt);base=nxt;document.getElementById('cardBase').textContent=toStr(base);document.getElementById('cardNext').style.display='none';bal+=profit;addHist('Cards WIN '+profit.toFixed(2))}else{if(nxt==base){document.getElementById('cardInfo').textContent='DRAW'}else{document.getElementById('cardInfo').textContent='LOSE '+toStr(base)+'->'+toStr(nxt);streak=0;bal+=profit;addHist('Cards LOSE');baseDrawn=false;base=null;document.getElementById('cardBtn').textContent='DRAW BASE'}}document.getElementById('streak').textContent=streak;render();}async function playAB(){let bet=get('cardBet');if(!check(bet))return;let f=await fair();let win=f>0.513;let profit=win?bet*0.95:-bet;bal+=profit;addHist('AB '+(win?'WIN':'LOSE')+' '+profit.toFixed(2));render();}</script></body></html>
